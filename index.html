<!DOCTYPE html>
<html lang="tr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Turkishbowl</title>
<meta name="theme-color" content="#1e3452">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">

<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f6f7fb;--card:#fff;--tx:#1d2433;--mu:#6b7385;--pr:#4f46e5;--ok:#16a34a;--bad:#dc2626;--bd:#e3e6ef}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12141c;--card:#1c2030;--tx:#eef0f7;--mu:#98a0b5;--pr:#818cf8;--ok:#4ade80;--bad:#f87171;--bd:#2c3248}}
:root[data-theme="dark"]{--bg:#12141c;--card:#1c2030;--tx:#eef0f7;--mu:#98a0b5;--pr:#818cf8;--ok:#4ade80;--bad:#f87171;--bd:#2c3248}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:18px}
#app{max-width:640px;margin:0 auto;padding:16px}
h1{font-size:26px;margin:8px 0}h2{font-size:20px;margin:6px 0}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px;margin:12px 0}
.btn{display:block;width:100%;padding:14px;border:0;border-radius:12px;background:var(--pr);color:#fff;font-size:18px;font-weight:600;margin:10px 0;cursor:pointer}
.btn.sec{background:transparent;color:var(--pr);border:2px solid var(--pr)}
.btn:disabled{opacity:.4}
.opt{display:block;width:100%;text-align:left;padding:14px;margin:8px 0;border:2px solid var(--bd);border-radius:12px;background:var(--card);color:var(--tx);font-size:18px;cursor:pointer}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 15%,var(--card))}
.opt.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 15%,var(--card))}
.lv{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.chip{padding:8px 14px;border-radius:20px;border:2px solid var(--bd);color:var(--mu);font-weight:600}
.chip.on{background:var(--pr);color:#fff;border-color:var(--pr)}
.bar{height:10px;background:var(--bd);border-radius:6px;overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;background:var(--pr);transition:width .3s}
.mu{color:var(--mu);font-size:15px}
.big{font-size:30px;font-weight:700}
input[type=text]{width:100%;padding:14px;font-size:20px;border:2px solid var(--bd);border-radius:12px;background:var(--card);color:var(--tx)}
.tiles{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0;min-height:48px}
.tile{padding:10px 14px;border-radius:10px;border:2px solid var(--bd);background:var(--card);color:var(--tx);font-size:18px;cursor:pointer}
.ans{border-bottom:2px dashed var(--bd);padding-bottom:10px;min-height:60px}
.ans .tile{border-color:var(--pr)}
.fb{padding:12px;border-radius:12px;margin:10px 0;font-weight:600}
.fb.ok{background:color-mix(in srgb,var(--ok) 18%,var(--card));color:var(--ok)}
.fb.bad{background:color-mix(in srgb,var(--bad) 18%,var(--card));color:var(--bad)}
.spk{background:none;border:0;font-size:24px;cursor:pointer}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
table{width:100%;border-collapse:collapse;margin:8px 0}td,th{border:1px solid var(--bd);padding:8px;text-align:left}th{background:var(--bg)}.rule{background:color-mix(in srgb,var(--pr) 12%,var(--card));border-radius:12px;padding:12px;margin:10px 0}.node-row{display:flex;margin:8px 0 22px}
.node{width:68px;height:68px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:700;border:4px solid var(--bd);background:var(--card);color:var(--mu);cursor:pointer;position:relative;flex:none}
.node.done{background:var(--ok);border-color:var(--ok);color:#fff;animation:pop .5s}
.node.cur{background:var(--pr);border-color:var(--pr);color:#fff;animation:pulse 1.6s infinite}
.node.lock{opacity:.55}
.node small{position:absolute;bottom:-20px;font-size:12px;color:var(--mu);font-weight:600;white-space:nowrap}
.pathline{border-left:4px dotted var(--bd);margin-left:34px;height:0}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--pr) 55%,transparent)}70%{box-shadow:0 0 0 18px transparent}100%{box-shadow:0 0 0 0 transparent}}
@keyframes pop{0%{transform:scale(.3)}70%{transform:scale(1.2)}100%{transform:scale(1)}}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.conf{position:fixed;top:-20px;width:10px;height:14px;animation:fall linear forwards;z-index:50}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:40;display:flex;align-items:center;justify-content:center;padding:20px}
.ovc{background:var(--card);border-radius:20px;padding:24px;text-align:center;animation:pop .5s;max-width:360px;width:100%}
.shake{animation:shake .3s}
.toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:12px 18px;border-radius:12px;z-index:60;font-size:16px;max-width:90%}
.hero{background:linear-gradient(135deg,var(--pr),#7c3aed);color:#fff;border-radius:18px;padding:18px;margin:14px 0}
.ht{font-size:22px;font-weight:700;margin:4px 0 10px}.mu2{opacity:.92;font-size:15px}
.bar2{height:10px;background:rgba(255,255,255,.3);border-radius:6px;overflow:hidden;margin:8px 0}.bar2 i{display:block;height:100%;background:#fff;transition:width .3s}
.hb{display:block;width:100%;padding:14px;border:0;border-radius:12px;background:#fff;color:#4f46e5;font-size:18px;font-weight:700;margin-top:12px;cursor:pointer}
.sec{background:var(--card);border:1px solid var(--bd);border-radius:16px;margin:12px 0;overflow:hidden}
.sec>summary{padding:16px;font-weight:700;cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:8px}
.sec>summary::-webkit-details-marker{display:none}
.sec>summary::after{content:'▾';margin-left:auto;padding-left:8px;color:var(--mu)}
.sec[open]>summary::after{content:'▴'}
.sec .inner{padding:0 12px 12px}
.ri{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--bd);border-radius:12px;background:var(--bg);margin:8px 0;cursor:pointer}
.ri .ic{font-size:24px}
.dg{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.dgi{aspect-ratio:1;border-radius:12px;border:2px solid var(--bd);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;cursor:pointer;background:var(--card);color:var(--mu);font-size:16px}
.dgi.done{background:var(--ok);color:#fff;border-color:var(--ok)}.dgi.cur{border-color:var(--pr);color:var(--pr)}.dgi.sel{outline:3px solid var(--pr);outline-offset:2px}.dgi.lock{opacity:.5}
.topbar{display:flex;align-items:center;gap:12px;margin:0 0 8px;position:sticky;top:0;background:var(--bg);padding:6px 0;z-index:5}
.back{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;padding:10px 14px;font-size:16px;font-weight:600;cursor:pointer}
.lnk{background:none;border:0;color:var(--pr);font-size:15px;cursor:pointer;text-decoration:underline;padding:6px}
.kn{display:block;width:100%;margin-top:10px;padding:10px;border-radius:10px;border:2px solid var(--bd);background:transparent;color:var(--tx);font-size:16px;cursor:pointer}
.kn.on{border-color:var(--ok);color:var(--ok);font-weight:700}
@media (min-width:768px){#app{max-width:820px;padding:24px 28px}body{font-size:19px}.dg{grid-template-columns:repeat(8,1fr)}}
@media (min-width:1100px){#app{max-width:980px}.sec .inner{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}.sec .inner>.dg,.sec .inner>.mu{grid-column:1/-1}}
body{font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:radial-gradient(1100px 480px at 50% -8%,color-mix(in srgb,var(--pr) 16%,transparent),transparent),var(--bg);background-attachment:fixed;padding-bottom:92px}
body.nonav{padding-bottom:18px}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
#app>*{animation:fadeUp .42s both}#app>*:nth-child(2){animation-delay:.05s}#app>*:nth-child(3){animation-delay:.1s}#app>*:nth-child(4){animation-delay:.15s}#app>*:nth-child(5){animation-delay:.2s}#app>*:nth-child(6){animation-delay:.25s}#app>*:nth-child(n+7){animation-delay:.3s}
.card,.sec,.ri,.stat{box-shadow:0 6px 18px rgba(30,40,90,.09)}
.btn,.opt,.ri,.tile,.hb,.dgi,.kn{transition:transform .15s,box-shadow .2s,background .2s}
.btn:active,.opt:active,.ri:active,.tile:active,.hb:active,.dgi:active{transform:scale(.96)}
.btn{border-radius:14px;box-shadow:0 10px 22px color-mix(in srgb,var(--pr) 30%,transparent)}.btn.sec{box-shadow:none}
.hero{box-shadow:0 16px 36px color-mix(in srgb,var(--pr) 36%,transparent)}
.opt{display:flex;align-items:center;gap:12px;border-radius:14px;padding:12px 14px}
.opt:hover{border-color:var(--pr)}
.lt{display:inline-flex;width:32px;height:32px;border-radius:10px;align-items:center;justify-content:center;background:color-mix(in srgb,var(--pr) 14%,var(--card));color:var(--pr);font-weight:800;flex:none}
.opt.ok .lt{background:var(--ok);color:#fff}.opt.bad .lt{background:var(--bad);color:#fff}.opt.ok{animation:pop .35s}.opt.bad{animation:shake .35s}
.qcard{background:var(--card);border:1px solid var(--bd);border-left:6px solid var(--pr);border-radius:18px;padding:16px 18px;margin:12px 0;box-shadow:0 8px 22px rgba(30,40,90,.10)}
.qtag{display:inline-block;font-size:12px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:#fff;background:linear-gradient(135deg,var(--pr),#7c3aed);padding:4px 11px;border-radius:20px;margin-bottom:10px}
.qtxt{font-size:21px;font-weight:600;white-space:pre-line;line-height:1.4}
.hint{margin-top:10px;padding:8px 12px;border-radius:10px;background:color-mix(in srgb,var(--pr) 9%,var(--card));color:var(--mu);font-size:15px}
.hdr{display:flex;align-items:center;gap:12px}.hdr img{width:52px;height:52px;border-radius:14px;box-shadow:0 6px 16px rgba(0,0,0,.2)}.hdr h1{margin:0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
.stat{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:12px 6px;text-align:center}.stat b{display:block;font-size:21px}.stat span{font-size:12px;color:var(--mu)}
#nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:6px;padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));background:color-mix(in srgb,var(--card) 90%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--bd);z-index:30;transition:transform .3s}
body.nonav #nav{transform:translateY(125%)}
#nav button{flex:1;max-width:170px;border:0;background:transparent;color:var(--mu);font-size:12px;font-weight:700;padding:6px 4px;border-radius:12px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
#nav button span{font-size:22px}#nav button.on{color:var(--pr);background:color-mix(in srgb,var(--pr) 13%,transparent)}
.kr{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 4px;border-bottom:1px solid var(--bd)}.kr .kn{width:auto;margin:0;padding:6px 16px}
.seg{flex:1;padding:10px;border-radius:12px;border:2px solid var(--bd);background:transparent;color:var(--tx);font-weight:600;cursor:pointer}.seg.on{border-color:var(--pr);color:var(--pr);background:color-mix(in srgb,var(--pr) 10%,transparent)}
.tb{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.tb .btn{margin:8px 0 0;padding:11px 4px;font-size:15px}
@media (min-width:768px){.stats{gap:16px}.stat b{font-size:26px}}
.sp{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:16px 18px;margin:12px 0;font-size:1.08em;line-height:1.85;box-shadow:0 6px 18px rgba(30,40,90,.08)}
.sn{cursor:pointer;border-radius:6px;padding:1px 2px;transition:background .2s}.sn:hover,.sn.on{background:color-mix(in srgb,var(--pr) 16%,transparent)}
.trl{display:none;color:var(--mu);font-style:italic;font-size:.9em;margin:2px 0 8px;padding-left:10px;border-left:3px solid var(--pr);line-height:1.5}
.sn.on+.trl,.showtr .trl{display:block}
.tb2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.tb2 .btn{margin:10px 0 0;padding:11px 6px;font-size:15px}
.ta{width:100%;min-height:96px;padding:12px;border-radius:12px;border:2px solid var(--bd);background:var(--card);color:var(--tx);font:inherit;font-size:16px;margin:10px 0;resize:vertical}
.ta:focus,input[type=text]:focus{outline:none;border-color:var(--pr)}
</style></head><body><div id="app"></div>
<script>
let W=[
{w:'student',tr:'öğrenci',s:'I am a student.',n:'I am not a student.',q:'Am I a student?',st:'Ben bir öğrenciyim.'},
{w:'teacher',tr:'öğretmen',s:'She is a teacher.',n:'She is not a teacher.',q:'Is she a teacher?',st:'O bir öğretmen.'},
{w:'doctor',tr:'doktor',s:'He is a doctor.',n:'He is not a doctor.',q:'Is he a doctor?',st:'O bir doktor.'},
{w:'happy',tr:'mutlu',s:'We are happy.',n:'We are not happy.',q:'Are we happy?',st:'Biz mutluyuz.'},
{w:'tired',tr:'yorgun',s:'They are tired.',n:'They are not tired.',q:'Are they tired?',st:'Onlar yorgun.'},
{w:'hungry',tr:'aç',s:'You are hungry.',n:'You are not hungry.',q:'Are you hungry?',st:'Sen açsın.'},
{w:'big',tr:'büyük',s:'The house is big.',n:'The house is not big.',q:'Is the house big?',st:'Ev büyük.'},
{w:'small',tr:'küçük',s:'The dog is small.',n:'The dog is not small.',q:'Is the dog small?',st:'Köpek küçük.'},
{w:'home',tr:'ev (yuva)',s:'I am at home.',n:'I am not at home.',q:'Am I at home?',st:'Ben evdeyim.'},
{w:'school',tr:'okul',s:'They are at school.',n:'They are not at school.',q:'Are they at school?',st:'Onlar okulda.'},
{w:'friend',tr:'arkadaş',s:'He is my friend.',n:'He is not my friend.',q:'Is he my friend?',st:'O benim arkadaşım.'},
{w:'book',tr:'kitap',s:'It is a book.',n:'It is not a book.',q:'Is it a book?',st:'O bir kitap.'},
{w:'cat',tr:'kedi',s:'The cat is black.',n:'The cat is not black.',q:'Is the cat black?',st:'Kedi siyah.'},
{w:'table',tr:'masa',s:'The book is on the table.',n:'The book is not on the table.',q:'Is the book on the table?',st:'Kitap masanın üstünde.'},
{w:'here',tr:'burada',s:'She is here.',n:'She is not here.',q:'Is she here?',st:'O burada.'},
{w:'ready',tr:'hazır',s:'We are ready.',n:'We are not ready.',q:'Are we ready?',st:'Biz hazırız.'},
{w:'busy',tr:'meşgul',s:'My mother is busy.',n:'My mother is not busy.',q:'Is my mother busy?',st:'Annem meşgul.'},
{w:'late',tr:'geç',s:'You are late.',n:'You are not late.',q:'Are you late?',st:'Sen geçsin (geç kaldın).'},
{w:'new',tr:'yeni',s:'The phone is new.',n:'The phone is not new.',q:'Is the phone new?',st:'Telefon yeni.'},
{w:'old',tr:'eski / yaşlı',s:'My car is old.',n:'My car is not old.',q:'Is my car old?',st:'Arabam eski.'}
];
W[17].st='Sen geç kaldın.';
let PARTS=[0,1,2,3,4].map(i=>W.slice(i*4,i*4+4));
const $=document.getElementById('app');
const sh=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const norm=s=>s.toLowerCase().replace(/[’]/g,"'").replace(/i'm/g,'i am').replace(/isn't/g,'is not').replace(/aren't/g,'are not').replace(/haven't/g,'have not').replace(/hasn't/g,'has not').replace(/doesn't/g,'does not').replace(/don't/g,'do not').replace(/can't/g,'cannot').replace(/can not/g,'cannot').replace(/didn't/g,'did not').replace(/wasn't/g,'was not').replace(/weren't/g,'were not').replace(/won't/g,'will not').replace(/mustn't/g,'must not').replace(/shouldn't/g,'should not').replace(/I'm not/g,'i am not').replace(/[.,!?]/g,'').replace(/\s+/g,' ').trim();
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;');
let done=[];try{done=JSON.parse(localStorage.getItem('kd2')||'[]')}catch(e){}
const save=()=>{try{localStorage.setItem('kd2',JSON.stringify(done))}catch(e){}};
function speak(t){try{const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.9;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}
let Q=[],idx=0,cur='',total=0,wrong=0,locked=false;
function opts(c,pool){return sh([c,...sh(pool.filter(x=>x!==c)).slice(0,3)])}
function genWord(x){if(typeof WFN==='function')return WFN(x);let a=genWord0(x);if(x.po)a=a.filter(e=>!/çevir|hangisi\?/.test(e.q));return a}
function genWord0(x){
  const ws=W.map(a=>a.w),trs=W.map(a=>a.tr);
  const blank=x.s.replace(new RegExp('\\b'+x.w+'\\b','i'),'____');
  return [
  {k:'choice',q:`"${x.w}" ne demek?`,o:opts(x.tr,trs),a:x.tr,sp:x.w},
  {k:'choice',q:`"${x.tr}" İngilizcede hangisi?`,o:opts(x.w,ws),a:x.w},
  {k:'type',q:`İngilizcesini yaz: ${x.tr}`,a:x.w},
  {k:'type',q:'🔊 Dinle ve yaz',a:x.w,sp:x.w},
  {k:'choice',q:`Boşluğu doldur: ${blank}\n(${x.st})`,o:opts(x.w,ws),a:x.w},
  {k:'order',q:`Cümleyi kur: ${x.st}`,a:x.s},
  {k:'type',q:`Cümleyi yaz: ${x.st}`,a:x.s},
  {k:'order',q:`Olumsuza çevir: ${x.s}`,a:x.n},
  {k:'order',q:`Soruya çevir: ${x.s}`,a:x.q},
  {k:'type',q:`Olumsuza çevir (yaz): ${x.s}`,a:x.n},
  {k:'order',q:`Olumluya çevir: ${x.n}`,a:x.s},
  {k:'choice',q:`"${x.st}" hangisi?`,o:sh([x.s,x.n,x.q]),a:x.s}
  ];
}
function genGram(x){
  if(typeof GFN==='function')return GFN(x);const mm=x.s.match(GRE);if(!mm)return [];const f=mm[1].toLowerCase();
  return [
  {k:'choice',q:`Doğru olanı seç: ${x.s.replace(GRE,'____')}\n(${x.st})`,o:GOPTS.slice(),a:f},
  {k:'type',q:`Olumsuza çevir (yaz): ${x.s}`,a:x.n},
  {k:'order',q:`Soruya çevir: ${x.s}`,a:x.q},
  {k:'type',q:`Soruya çevir (yaz): ${x.s}`,a:x.q},
  {k:'order',q:`Olumluya çevir: ${x.n}`,a:x.s}
  ];
}
function home(){
  const d=t=>done.includes(key(t))?'✅':'';
  $.innerHTML=`<h1>📘 Turkishbowl</h1><div class="mu" style="margin:-4px 0 6px">by Rümeysa Memiş</div>
  <div class="lv">${chipsHtml()}</div>
  ${mapHtml()}<div id="tasks"></div><div class="card"><h2>${lvOf(D).n} · Gün ${D-lvOf(D).s+1}: ${DAYS[D].title}</h2><div class="mu">Seçili: <b>Gün ${D-lvOf(D).s+1} / ${lvOf(D).t}</b> · ${lvOf(D).n} toplam <b>${lvOf(D).t*20} kelime</b>, <b>${lvOf(D).t} gün</b></div><button class="btn sec" onclick="plan()">🗺️ Tüm planı ve gramer konularını gör</button><div class="mu">1) Konuyu öğren → 2) Gramer alıştırması → 3) 20 kelime (her kelime 12 alıştırma)</div></div>
  <div class="card"><b>📖 Konu anlatımı ${d('lesson')}</b><button class="btn" onclick="lesson()">Konuyu oku</button></div>
  <div class="card"><b>🌙 Akşam hikayesi ${d('story')}</b><div class="mu">Bugünkü kelimelerle kısa hikaye + sorular</div><button class="btn" onclick="story()">Hikayeyi oku</button></div>
  ${D===14?'<div class="card"><b>🎓 A1 Sınavı '+(done.includes('exam')?'✅':'')+'</b><div class="mu">Tüm günlerden 40 karışık soru</div><button class="btn" onclick="startExam()">Sınava başla</button></div>':''}<div class="card"><b>✏️ Gramer pratiği ${d('gram')}</b><div class="mu">am/is/are seçme, olumsuz, soru · her seferinde farklı 30 soru</div><button class="btn" onclick="startGram()">Başla</button></div>
  ${PARTS.map((p,i)=>`<div class="card"><b>🔤 Kelime bölümü ${i+1} ${d('p'+i)}</b><div class="mu">${p.map(a=>a.w).join(', ')}</div><button class="btn" onclick="intro(${i})">Başla</button></div>`).join('')}
  <p class="mu">A2–C2 ve diğer günler sonraki sürümlerde.</p>`;
  celebrate();
}
function lesson(){
  if(D>0)return lessonN();

function head(){return `<div class="row"><button class="spk" onclick="home()">✕</button><div class="mu">${Math.min(idx+1,Q.length)} / ${Q.length}</div></div><div class="bar"><i style="width:${Math.min(100,idx/Q.length*100)}%"></i></div>`}
function show(){
  if(idx>=Q.length)return finish();
  locked=false;const e=Q[idx];
  let h=head()+`${qcard(e)}`+(e.wk?'<div style="text-align:right;margin:-4px 0 6px"><button class="lnk" onclick="knowWord()">✔ Bu kelimeyi biliyorum</button></div>':'');
  if(e.sp){setTimeout(()=>speak(e.sp),200);h+=`<button class="btn sec" onclick="speak('${e.sp}')">🔊 Tekrar dinle</button>`}
  if(e.k==='choice')h+=e.o.map((o,i)=>`<button class="opt" id="o${i}" onclick="pick(${i})"><b class="lt">${'ABCD'[i]||(i+1)}</b><span>${esc(o)}</span></button>`).join('');
  if(e.k==='type')h+=`<input type="text" id="inp" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"><button class="btn" onclick="chkType()">Kontrol et</button>`;
  if(e.k==='order'){
    e.t=sh(e.a.replace(/[.?!]/g,'').split(' ').map(w=>w==='I'?w:w.toLowerCase()));e.sel=[];
    h+=`<div class="tiles ans" id="ans"></div><div class="tiles" id="pool"></div><button class="btn" onclick="chkOrder()">Kontrol et</button>`;
  }
  h+=`<div id="fb"></div>`;$.innerHTML=h;
  if(e.k==='order')drawOrder();
  if(e.k==='type'){const i=document.getElementById('inp');i.focus();i.onkeydown=ev=>{if(ev.key==='Enter')chkType()}}
}
function drawOrder(){
  const e=Q[idx];
  document.getElementById('ans').innerHTML=e.sel.map((ti,n)=>`<button class="tile" onclick="unsel(${n})">${esc(e.t[ti])}</button>`).join('');
  document.getElementById('pool').innerHTML=e.t.map((w,ti)=>e.sel.includes(ti)?'':`<button class="tile" onclick="sel(${ti})">${esc(w)}</button>`).join('');
}
function sel(i){if(locked)return;Q[idx].sel.push(i);drawOrder()}
function unsel(n){if(locked)return;Q[idx].sel.splice(n,1);drawOrder()}
function pick(i){if(locked)return;const e=Q[idx];const ok=e.o[i]===e.a;
  document.getElementById('o'+i).classList.add(ok?'ok':'bad');
  if(!ok)document.getElementById('o'+e.o.indexOf(e.a)).classList.add('ok');
  result(ok,e.a)}
function chkType(){if(locked)return;const e=Q[idx];result(norm(document.getElementById('inp').value)===norm(e.a),e.a)}
function chkOrder(){if(locked)return;const e=Q[idx];result(norm(e.sel.map(i=>e.t[i]).join(' '))===norm(e.a),e.a)}
function result(ok,ans){
  locked=true;const e=Q[idx];
  if(!ok){wrong++;if((e.rep||0)<2)Q.push(Object.assign({},e,{sel:[],rep:(e.rep||0)+1}))}
  document.getElementById('fb').innerHTML=`<div class="fb ${ok?'ok':'bad'}">${ok?'✅ Doğru!':'❌ Doğrusu: '+esc(ans)}</div>${e.exp?'<div class="hint" style="margin:8px 0">💡 '+esc(e.exp)+'</div>':''}<button class="btn" onclick="nextQ()">Devam</button>`;
  if(/[a-z]/i.test(ans)&&(e.k!=='choice'||/^[A-Za-z]/.test(ans)))speak(ans);
}
function finish(){
  if(cur&&!done.includes(cur)){done.push(cur);save()}

}

function nodeTap(i,el){

}
function mapHtml(){

let PLACE=0,PLACED=false,known=[];

const saveK=()=>{try{localStorage.setItem('kd2k',JSON.stringify(known))}catch(e){}};
const wkey=(i,w)=>i+':'+w;
const isKnown=x=>known.includes(wkey(D,x.w));
const encA=t=>encodeURIComponent(t).replace(/'/g,'%27');
function tagEx(arr,x){return arr.map(e=>Object.assign({},e,{wk:wkey(D,x.w),src:x.s||x.q||x.w}))}
function pick9(a){const base=a.slice(0,6),rest=sh(a.slice(6));return base.concat(rest.slice(0,3))}
function spread(a){const out=[],rest=a.slice();while(rest.length){let i=rest.findIndex(e=>!out.length||e.src!==out[out.length-1].src);if(i<0)i=0;out.push(rest.splice(i,1)[0])}return out}
function startWords(i){
  cur=key('p'+i);
  const ws=PARTS[i].filter(x=>!isKnown(x));
  if(!ws.length){if(!done.includes(cur)){done.push(cur);save()}toast('Bu bölümdeki tüm kelimeleri biliyorsun ✅');return home()}
  Q=spread(sh(ws.flatMap(x=>tagEx(pick9(genWord(x)),x))));begin();
}
function startGram(){
  cur=key('gram');
  const ws=W.filter(x=>!isKnown(x));
  const lists=sh(ws).map(x=>sh(tagEx(genGram(x),x))).filter(l=>l.length);
  const first=lists.map(l=>l[0]);
  const second=sh(lists.filter(l=>l.length>1)).slice(0,Math.max(0,30-first.length)).map(l=>l[1]);
  Q=spread(sh(first.concat(second)).slice(0,30));
  if(!Q.length){if(!done.includes(cur)){done.push(cur);save()}toast('Bu günün kelimelerini biliyorsun ✅');return home()}
  begin();
}
function knowWord(){
  const e=Q[idx];if(!e||!e.wk)return;
  if(!known.includes(e.wk)){known.push(e.wk);saveK()}
  let removed=0;Q=Q.filter((q,k)=>{if(k>idx&&q.wk===e.wk){if(k<total)removed++;return false}return true});
  total=Math.max(idx+1,total-removed);
  toast('Tamam, bu kelime bir daha sorulmayacak ✅');nextQ();
}
function toggleKnown(i,j){const x=PARTS[i][j],k=wkey(D,x.w),p=known.indexOf(k);if(p>=0)known.splice(p,1);else known.push(k);saveK();intro(i)}
function markPart(i){PARTS[i].forEach(x=>{const k=wkey(D,x.w);if(!known.includes(k))known.push(k)});saveK();const c=key('p'+i);if(!done.includes(c)){done.push(c);save()}toast('Bölüm geçildi ✅');home()}
function intro(i){
  cur=key('p'+i);

    return '<div class="card"><div class="row"><div class="big">'+esc(x.w)+'</div><div><button class="spk" onclick="speak(decodeURIComponent(\''+encA(x.w)+'\'))">🔊</button></div></div><div>'+esc(x.tr)+'</div><div class="mu" style="margin-top:8px">'+esc(x.s)+' <button class="spk" style="font-size:18px" onclick="speak(decodeURIComponent(\''+encA(x.s)+'\'))">🔊</button><br>'+esc(x.st)+'<br>'+(x.a?'💬 '+esc(x.a):(x.po?'':'➖ '+esc(x.n)+'<br>❓ '+esc(x.q)))+'</div><button class="kn '+(kn?'on':'')+'" onclick="toggleKnown('+i+','+j+')">'+(kn?'✔ Biliyorum (sorulmaz)':'Bu kelimeyi biliyorum')+'</button></div>';
  }).join('')+'<button class="btn" onclick="startWords('+i+')">Alıştırmalara geç</button><button class="btn sec" onclick="markPart('+i+')">Hepsini biliyorum, bölümü geç</button>';
}

function tagTr(s,st){const m=s.match(/^(He|She|It|This|That|These|Those)\b/);if(!m)return st;const t={He:'erkek',She:'kadın',It:'nesne/hayvan',This:'yakın, tek',That:'uzak, tek',These:'yakın, çoğul',Those:'uzak, çoğul'}[m[1]];return st+' ['+t+']'}

function tagEx(arr,x){return arr.map(e=>{const has=e.q.includes(x.st);const eng=e.q.includes(x.s)||(x.n&&e.q.includes(x.n))||(x.q&&e.q.includes(x.q));return Object.assign({},e,{wk:wkey(D,x.w),src:x.s||x.q||x.w,hint:(eng&&!has&&x.st)?x.st:null})})}

function streak(){try{return JSON.parse(localStorage.getItem('kd2st')||'{"n":0,"d":""}')}catch(e){return{n:0,d:''}}}
const dstr=d=>d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();
function touchStreak(){const t=new Date(),y=new Date(t.getTime()-864e5),s=streak();if(s.d===dstr(t))return;s.n=(s.d===dstr(y))?s.n+1:1;s.d=dstr(t);try{localStorage.setItem('kd2st',JSON.stringify(s))}catch(e){}}
function streakNow(){const s=streak(),t=new Date(),y=new Date(t.getTime()-864e5);return(s.d===dstr(t)||s.d===dstr(y))?s.n:0}

[['If she had checked the schedule twice, she would have left the library earlier.','Tarifeyi iki kez kontrol etseydi kütüphaneden daha erken çıkardı.'],['Now she had two options: she could either take an expensive taxi or wait until morning.','Şimdi iki seçeneği vardı: pahalı bir taksiye binebilir ya da sabaha kadar bekleyebilirdi.'],['Since her phone battery had died, she could not call anyone.','Telefonunun pili bittiği için kimseyi arayamıyordu.']],
[['Suddenly, a security guard approached her.','Birden bir güvenlik görevlisi ona yaklaştı.'],['“You can’t stay here all night,” he said kindly, “but my brother drives a minibus to your area.','“Bütün gece burada kalamazsınız,” dedi nazikçe, “ama kardeşim sizin bölgeye minibüs sürüyor.'],['He might still be around.”','Hâlâ civarda olabilir.”'],['Twenty minutes later, Mina was on her way home, grateful for the unexpected help.','Yirmi dakika sonra Mina beklenmedik yardım için minnettar bir şekilde eve gidiyordu.']]],
q:[['What time did Mina arrive?','Mina saat kaçta geldi?','At midnight',['At noon','At six','At ten']],['What had happened to the train?','Trene ne olmuştu?','It had already left.',['It was delayed.','It was cancelled.','It was full.']],['Why could she not call anyone?','Neden kimseyi arayamadı?','Her phone battery had died.',['She had no friends.','She lost her phone.','The signal was weak.']],['Who helped her?','Ona kim yardım etti?','A security guard',['A taxi driver','A teacher','A student']]]},
{id:'c1-2',lv:'C1',t:'A Quiet Revolution',e:'🌱',p:[
[['In the small village of Kuzeyköy, a quiet revolution is taking place.','Kuzeyköy adlı küçük köyde sessiz bir devrim yaşanıyor.'],['What began as a modest community garden has gradually become a model for sustainable living.','Mütevazı bir topluluk bahçesi olarak başlayan şey zamanla sürdürülebilir yaşam için bir model hâline geldi.'],['Not only do residents grow their own vegetables, but they also share tools, knowledge and surplus food.','Sakinler yalnızca kendi sebzelerini yetiştirmekle kalmıyor, aletlerini, bilgilerini ve fazla yiyeceklerini de paylaşıyor.']],
[['It was the elderly farmers who first insisted on preserving traditional methods.','Geleneksel yöntemleri korumakta ilk ısrar edenler yaşlı çiftçilerdi.'],['Rarely do they use chemicals, and never have they wasted water.','Nadiren kimyasal kullanırlar ve hiçbir zaman su israf etmemişlerdir.'],['Young people, who initially dismissed these practices as outdated, are now eager to learn.','Bu uygulamaları başta demode diye reddeden gençler artık öğrenmeye hevesli.']],
[['The project is believed to have reduced the village’s waste by half.','Projenin köyün atığını yarıya indirdiğine inanılıyor.'],['Were it not for the villagers’ persistence, it would probably have collapsed in its first winter.','Köylülerin azmi olmasaydı proje büyük olasılıkla ilk kışında çökerdi.'],['What impresses visitors most is how naturally cooperation has become part of daily life.','Ziyaretçileri en çok etkileyen, iş birliğinin günlük hayatın ne kadar doğal bir parçası olduğu.']]],
q:[['What began as a community garden?','Topluluk bahçesi olarak ne başladı?','A model for sustainable living',['A shop','A school','A factory']],['Who first insisted on traditional methods?','Geleneksel yöntemlerde ilk kim ısrar etti?','The elderly farmers',['The young people','The visitors','The teachers']],['What is the project believed to have done?','Projenin ne yaptığına inanılıyor?','Reduced waste by half',['Doubled the harvest','Closed the school','Attracted factories']],['What impresses visitors most?','Ziyaretçileri en çok ne etkiliyor?','How naturally cooperation became part of daily life',['The size of the garden','The low prices','The modern buildings']]]},
{id:'c1-3',lv:'C1',t:'Between Two Languages',e:'🗣️',p:[
[['Having grown up speaking both Turkish and German, Leyla has always felt caught between two worlds.','Hem Türkçe hem Almanca konuşarak büyüyen Leyla kendini hep iki dünya arasında kalmış hissetti.'],['Whenever she visits her grandparents in Anatolia, she notices subtle differences in the way she thinks and jokes.','Anadolu’daki büyükanne ve büyükbabasını her ziyaret ettiğinde düşünme ve şakalaşma biçiminde ince farklar fark ediyor.'],['It is as if she becomes a slightly different person.','Sanki biraz farklı bir insana dönüşüyor.']],
[['Linguists suggest that bilingual speakers may adopt distinct perspectives depending on the language they use.','Dilbilimciler iki dilli konuşurların kullandıkları dile göre farklı bakış açıları benimseyebileceğini öne sürüyor.'],['Leyla, for her part, insists that no single language can capture all her emotions.','Leyla ise hiçbir dilin tüm duygularını yakalayamayacağında ısrar ediyor.'],['Were she forced to choose, she would be unable to do so.','Seçmeye zorlansa bunu yapamazdı.']],
[['Rather than seeing her identity as divided, she has learned to regard it as enriched.','Kimliğini bölünmüş olarak görmek yerine zenginleşmiş olarak görmeyi öğrendi.'],['What she values most is the ability to move between cultures without losing herself.','En çok değer verdiği şey kendini kaybetmeden kültürler arasında geçiş yapabilmek.'],['Should anyone ask her where she belongs, she simply smiles and says, “Everywhere I can speak.”','Biri nereye ait olduğunu sorarsa gülümseyip “Konuşabildiğim her yere,” diyor.']]],
q:[['Which languages does Leyla speak?','Leyla hangi dilleri konuşuyor?','Turkish and German',['Turkish and French','German and English','English and Spanish']],['What does she notice at her grandparents’ home?','Büyükanne ve büyükbabasının yanında ne fark ediyor?','Subtle differences in how she thinks and jokes',['That she forgets Turkish','That she feels bored','That she speaks louder']],['What do linguists suggest?','Dilbilimciler ne öne sürüyor?','Bilinguals may adopt different perspectives depending on the language.',['Bilinguals are confused.','Learning two languages is impossible.','Only one language is useful.']],['How does she answer where she belongs?','Nereye ait olduğunu sorulunca ne diyor?','“Everywhere I can speak.”',['“Only in Germany.”','“Nowhere.”','“In Anatolia.”']]]},
{id:'c2-1',lv:'C2',t:'The Weight of Words',e:'📚',p:[
[['The novelist’s latest work, though ostensibly a simple tale of family reconciliation, is in fact a meticulous meditation on the fragility of memory.','Romancının son eseri, görünürde aile içi barışmanın basit bir hikâyesi olsa da aslında belleğin kırılganlığı üzerine titiz bir tefekkür.'],['Each chapter unfolds with deliberate restraint, allowing ambiguity to linger long after the final sentence.','Her bölüm kasıtlı bir ölçülülükle açılıyor ve belirsizliğin son cümleden çok sonra bile sürmesine izin veriyor.']],
[['Critics have been divided.','Eleştirmenler ikiye bölündü.'],['Some praise its lucid, understated prose, whereas others dismiss it as indulgent and needlessly obscure.','Bazıları net ve abartısız diline övgü yağdırırken diğerleri onu fazla kendini beğenmiş ve gereksiz yere kapalı bularak reddediyor.'],['Nevertheless, even its harshest detractors concede that few contemporary authors command language with such precision.','Yine de en sert eleştirmenleri bile çağdaş yazarlardan çok azının dile bu kadar hâkim olduğunu kabul ediyor.']],
[['Having read the book twice, I remain unsure whether its power lies in what it says or in what it withholds.','Kitabı iki kez okuduktan sonra gücünün söylediklerinde mi yoksa söylemediklerinde mi yattığından hâlâ emin değilim.'],['Perhaps that is the point: great literature seldom offers answers; rather, it sharpens the questions we dare to ask.','Belki de mesele bu: büyük edebiyat nadiren cevap sunar; daha çok sormaya cesaret ettiğimiz soruları keskinleştirir.']]],
q:[['What is the novel ostensibly about?','Roman görünürde neyi anlatıyor?','Family reconciliation',['A war','A journey','A crime']],['What is it in fact?','Aslında nedir?','A meditation on the fragility of memory',['A love story','A detective novel','A travel diary']],['How are the critics?','Eleştirmenler nasıl?','Divided',['All positive','All negative','Silent']],['What is the narrator unsure about?','Anlatıcı neden emin değil?','Whether its power lies in what it says or withholds',['Whether the book is long','Whether the author is famous','Whether to buy it']]]}
);

  const bk=(lv,t)=>'<div class="card"><b>'+t+'</b><div class="mu">'+cnt(lv,'all')+' soru · her cevaptan sonra Türkçe açıklama</div><div class="tb"><button class="btn sec" onclick="startBank(\''+lv+'\',\'o\',15)">Orta</button><button class="btn sec" onclick="startBank(\''+lv+'\',\'z\',15)">Zor</button><button class="btn sec" onclick="startBank(\''+lv+'\',\'all\',30)">Hepsi</button></div></div>';
  const lv=(li,t,sub)=>'<div class="card"><b>'+t+'</b><div class="mu">'+sub+'</div><div class="tb"><button class="btn sec" onclick="startTest('+li+',\'orta\',20)">Orta · 20</button><button class="btn sec" onclick="startTest('+li+',\'zor\',20)">Zor · 20</button><button class="btn sec" onclick="startTest('+li+',\'karma\',40)">Uzun · 40</button></div></div>';
  let h='<div class="root"></div><h1>📝 Testler</h1><div class="mu">Tamamen isteğe bağlı. Günleri ilerletmek için çözmen gerekmez.</div><h2 style="margin-top:16px">📚 Soru Bankası</h2><div class="mu">Elle yazılmış, açıklamalı '+BANK.length+' soru. Orta ve zor seviyeler.</div>';
  ['A1','A2','B1','B2','C1'].forEach(x=>{h+=bk(x,x+' Genel Tekrar')});
  h+=bk('ALL','🎲 Tüm Seviyeler Karışık');
  h+='<h2 style="margin-top:18px">⚙️ Otomatik Testler</h2><div class="mu">Her seferinde yeniden üretilir, günlerdeki kelime ve cümlelerden.</div>';
  LV.forEach((L,i)=>{if(L.s<DAYS.length)h+=lv(i,L.n+' Tekrar Testi',Math.min(L.t,DAYS.length-L.s)+' günün konularından')});
  h+=lv(-1,'🎲 Karışık Genel Test','Tüm seviyelerden');
  $.innerHTML=h;
}

(function(){let k=0;while(k+1<DAYS.length&&dayDone(k))k++;setDay(Math.min(Math.max(k,PLACE),DAYS.length-1))})();
applyTheme();startApp();
</script><script>
